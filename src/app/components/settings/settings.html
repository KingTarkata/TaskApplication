<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true" aria-labelledby="settingsTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title h5" id="settingsTitle">
          <i class="bi {{ t.icons.settingsTitle }} me-2 text-success"></i>{{ t.settings.title }}
        </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" [attr.aria-label]="t.settings.close"></button>
      </div>

      <div class="modal-body">
        <h3 class="h6 text-muted mb-3">{{ t.settings.dataHeading }}</h3>

        <div class="d-grid gap-2">
          <button class="action-tile" type="button" (click)="downloadData()">
            <span class="action-icon" style="--c: var(--hs-sage)"><i class="bi bi-download"></i></span>
            <span class="text-start">
              <span class="d-block fw-bold">{{ t.settings.exportTitle }}</span>
              <small class="text-muted">{{ t.settings.exportSubtitle }}</small>
            </span>
          </button>

          <button class="action-tile" type="button" (click)="triggerImport()">
            <span class="action-icon" style="--c: var(--hs-honey)"><i class="bi bi-upload"></i></span>
            <span class="text-start">
              <span class="d-block fw-bold">{{ t.settings.importTitle }}</span>
              <small class="text-muted">{{ t.settings.importSubtitle }}</small>
            </span>
          </button>

          <input type="file" id="importFile" class="d-none" accept=".json,application/json" (change)="onFileSelected($event)">
        </div>
      </div>

      <div class="modal-footer justify-content-between">
        <small class="text-muted">{{ t.app.name }} {{ t.app.version }}</small>
        <button type="button" class="btn btn-soft btn-sm" data-bs-dismiss="modal">{{ t.settings.close }}</button>
      </div>

    </div>
  </div>
</div>
